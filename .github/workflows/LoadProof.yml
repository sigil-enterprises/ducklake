name: Load Proof

# A green build proves compilation only. This job proves the RELEASED linux_amd64
# asset dynamically LOADs into a stock duckdb built at the pinned sha and can
# ATTACH an encrypted lake - the property a consumer image actually depends on.

on:
  workflow_dispatch:
    inputs:
      extension_url:
        description: URL of the .duckdb_extension asset to prove
        required: true
        default: https://github.com/sigil-enterprises/ducklake/releases/download/v0.2.0-rc.3/ducklake-linux_amd64-duckdb-c97bd8b96e.duckdb_extension
      extension_sha256:
        description: Expected sha256 of that asset
        required: true
        default: a3d48d613da1441df44b2e1610d6bb8300522b5724d94ade6434b96daaa1853d
  push:
    branches:
      - 'proof/**'

env:
  EXTENSION_URL: https://github.com/sigil-enterprises/ducklake/releases/download/v0.2.0-rc.3/ducklake-linux_amd64-duckdb-c97bd8b96e.duckdb_extension
  EXTENSION_SHA256: a3d48d613da1441df44b2e1610d6bb8300522b5724d94ade6434b96daaa1853d

jobs:
  load-proof:
    name: LOAD + ATTACH ENCRYPTED on linux_amd64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check out the pinned duckdb
        run: |
          set -euxo pipefail
          cd duckdb
          git checkout "$(cat ../.github/duckdb-version)"
          git rev-parse HEAD
          git describe --tags || true

      - name: Install build deps
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake build-essential libssl-dev libcurl4-openssl-dev

      - name: Build a STOCK duckdb at the pinned sha (no ducklake linked in)
        env:
          GEN: ninja
          CORE_EXTENSIONS: 'parquet;json;icu;httpfs'
        run: |
          set -euxo pipefail
          cd duckdb
          make release
          ./build/release/duckdb -c "PRAGMA version;"

      - name: Fetch the published asset exactly as a consumer image does
        env:
          IN_URL: ${{ github.event.inputs.extension_url }}
          IN_SHA: ${{ github.event.inputs.extension_sha256 }}
        run: |
          set -euxo pipefail
          URL="${IN_URL:-$EXTENSION_URL}"
          SHA="${IN_SHA:-$EXTENSION_SHA256}"
          curl -fsSL -o /tmp/ducklake.duckdb_extension "$URL"
          echo "$SHA  /tmp/ducklake.duckdb_extension" | sha256sum -c -
          ls -l /tmp/ducklake.duckdb_extension
          file /tmp/ducklake.duckdb_extension
          tail -c 512 /tmp/ducklake.duckdb_extension | strings | tail -5

      - name: PROVE it loads and attaches an encrypted lake
        run: |
          set -euxo pipefail
          rm -rf /tmp/lakefiles /tmp/proof.db
          mkdir -p /tmp/lakefiles
          ./duckdb/build/release/duckdb -unsigned -c "
            PRAGMA version;
            LOAD httpfs;
            LOAD '/tmp/ducklake.duckdb_extension';
            SELECT extension_name, loaded, installed FROM duckdb_extensions() WHERE extension_name = 'ducklake';
            ATTACH 'ducklake:/tmp/proof.db' AS lake (DATA_PATH '/tmp/lakefiles/', ENCRYPTED, DATA_INLINING_ROW_LIMIT 0);
            CREATE TABLE lake.t AS SELECT range AS x FROM range(5);
            SELECT count(*) AS rows_written, sum(x) AS checksum FROM lake.t;
            DETACH lake;
          "
          ./duckdb/build/release/duckdb -unsigned -c "
            LOAD httpfs;
            LOAD '/tmp/ducklake.duckdb_extension';
            ATTACH 'ducklake:/tmp/proof.db' AS lake2;
            SELECT count(*) AS rows_after_reattach, sum(x) AS checksum FROM lake2.t;
          "

      # A PLAINTEXT lake built the same way, as the positive control for the
      # ciphertext assertion below. Without it, "the plain-parquet read was
      # refused" is an absence assertion with nothing proving it can fire -
      # and read_parquet refuses an EMPTY glob with the same non-zero exit,
      # so a lake that wrote nothing would read as perfectly encrypted.
      - name: Build the plaintext control lake
        run: |
          set -euxo pipefail
          rm -rf /tmp/plainfiles /tmp/plain.db
          mkdir -p /tmp/plainfiles
          ./duckdb/build/release/duckdb -unsigned -c "
            LOAD httpfs;
            LOAD '/tmp/ducklake.duckdb_extension';
            ATTACH 'ducklake:/tmp/plain.db' AS plain (DATA_PATH '/tmp/plainfiles/', DATA_INLINING_ROW_LIMIT 0);
            CREATE TABLE plain.t AS SELECT range AS x FROM range(5);
            DETACH plain;
          "

      - name: PROVE the data files are actually ciphertext
        run: |
          set -euxo pipefail

          # Magic bytes are the discriminator: DuckDB writes 'PAR1' for a plain
          # parquet and 'PARE' for an encrypted one. Asserting the POSITIVE
          # value cannot pass vacuously the way "some command failed" can.
          assert_magic() {
            dir="$1"; want="$2"; label="$3"
            n=$(find "$dir" -name '*.parquet' | wc -l)
            echo "$label: $n parquet file(s) under $dir"
            if [ "$n" -eq 0 ]; then
              echo "::error:: $label wrote NO parquet files, so the assertion was never exercised. Failing: a lake that writes nothing must never read as a pass." >&2
              exit 1
            fi
            # Process substitution, NOT a pipe: `exit 1` inside a piped
            # `while` runs in a subshell and the step still passes.
            while read -r f; do
              got=$(head -c 4 "$f")
              if [ "$got" != "$want" ]; then
                echo "::error:: $label: $f starts with '$got', expected '$want'." >&2
                exit 1
              fi
            done < <(find "$dir" -name '*.parquet')
          }

          assert_magic /tmp/lakefiles  PARE "encrypted lake"
          assert_magic /tmp/plainfiles PAR1 "plaintext control"

          # Now the behavioural pair, which must go OPPOSITE ways. Both
          # directions are asserted, so neither can pass by accident.
          if ./duckdb/build/release/duckdb -unsigned -c "SELECT count(*) FROM read_parquet('/tmp/lakefiles/**/*.parquet');"; then
            echo "::error:: encrypted data files were readable as plain parquet" >&2
            exit 1
          fi
          echo "OK: plain-parquet read of the ENCRYPTED files was refused"

          if ! ./duckdb/build/release/duckdb -unsigned -c "SELECT count(*) FROM read_parquet('/tmp/plainfiles/**/*.parquet');"; then
            echo "::error:: the plaintext control was ALSO unreadable, so the refusal above proves nothing about encryption" >&2
            exit 1
          fi
          echo "OK: the plaintext control read back, so the refusal above is specific to encryption"
