name: DBMS Catalog Tests
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  repository_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash

jobs:
  ducklake-config-tests:
    name: DuckDB Tests with DuckLake + (Postgres/SQLite)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ startsWith(vars.CI_RUNS_ON, '[') && fromJSON(vars.CI_RUNS_ON) || vars.CI_RUNS_ON || 'gama-arc' }}
    strategy:
      matrix:
        arch: ['linux_amd64']
        vcpkg_version: [ '2023.04.15' ]
        include:
          - arch: 'linux_amd64'
            vcpkg_triplet: 'x64-linux'

    env:
      VCPKG_TARGET_TRIPLET: ${{ matrix.vcpkg_triplet }}
      GEN: Ninja
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      ENABLE_SQLITE_SCANNER: ON
      ENABLE_POSTGRES_SCANNER: ON
      ENABLE_QUACK: ON
      BUILD_EXTENSION_TEST_DEPS: full

    steps:
    # ikalnytskyi/action-setup-postgres@v7 installs postgresql as root (tee into
    # /etc/apt, apt-key, package install; read at v7), which the gama-arc runner cannot do.
    # Same major (15) and credentials, as a container on the pool's dind daemon.
    # No ssl: the action's ssl:true was a self-signed server cert and nothing in
    # test/configs/postgres.json asks for it.
    - name: Start PostgreSQL 15 (container, no root)
      run: |
        set -euo pipefail
        docker rm -f ducklake-pg >/dev/null 2>&1 || true
        docker run -d --name ducklake-pg -p 127.0.0.1:5432:5432 \
          -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=postgres \
          docker.io/library/postgres:15
        ready=0
        for i in $(seq 1 60); do
          if docker exec ducklake-pg pg_isready -h 127.0.0.1 -U postgres -d postgres; then ready=1; break; fi
          sleep 2
        done
        if [ "$ready" != 1 ]; then
          echo "::error::PostgreSQL did not become ready within 120s"
          docker logs ducklake-pg || true
          exit 1
        fi
        # libpq service named `postgres`, as the action wrote it; the test step selects it.
        printf '[postgres]\nhost=127.0.0.1\nport=5432\nuser=postgres\npassword=postgres\ndbname=postgres\n' \
          > "$RUNNER_TEMP/pg_service.conf"
        echo "PGSERVICEFILE=$RUNNER_TEMP/pg_service.conf" >> "$GITHUB_ENV"

    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
        submodules: 'true'

    - name: Checkout DuckDB to version
      run: |
        cd duckdb
        git checkout $(cat ../.github/duckdb-version)

    # The version this job checks out must be a RELEASE tag; a dev sha here is
    # what made #43, and it stays green until a consumer tries to load it.
    - uses: ./.github/actions/refuse-unreleased-duckdb-pin

    - uses: ./.github/actions/user-space-build-tools

    - name: Setup Ccache
      uses: hendrikmuhs/ccache-action@main
      with:
        install: 'no'  # ccache comes from user-space-build-tools; the action would need root (forge#126)
        key: ${{ github.job }}
        save: ${{ github.ref == 'refs/heads/main' }}

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11.1
      with:
        vcpkgGitCommitId: 84bab45d415d22042bd0b9081aea57f362da3f35

    - name: Build extension
      env:
        GEN: ninja
      run: |
        make release

    - name: Test Quack
      run: |
        REPO_DIR=$(dirname $(find build/release/repository -name "quack.duckdb_extension" | head -1))
        DUCKDB_VER=$(basename $(dirname "$REPO_DIR"))
        EXT_DIR="$HOME/.duckdb/extensions/$DUCKDB_VER/${{ matrix.arch }}"
        mkdir -p "$EXT_DIR"
        cp "$REPO_DIR/quack.duckdb_extension" "$EXT_DIR/"
        python3 scripts/run_quack_tests.py --slow --no-install

    - name: Test SQLite
      run: |
        build/release/test/unittest --test-config test/configs/sqlite.json --test-dir ./ "test/sql/*"

    - name: Test Postgres
      env:
        PGSERVICE: postgres
      run: |
        # Pre-install postgres_scanner so LOAD finds it without autoloading
        # (autoloading is disabled to prevent loading wrong ducklake version)
        # Find the actual extension folder - CMake uses the git hash for dev builds
        # and the version string for release builds
        REPO_DIR=$(dirname $(find build/release/repository -name "postgres_scanner.duckdb_extension" | head -1))
        DUCKDB_VER=$(basename $(dirname "$REPO_DIR"))
        EXT_DIR="$HOME/.duckdb/extensions/$DUCKDB_VER/${{ matrix.arch }}"
        mkdir -p "$EXT_DIR"
        cp "$REPO_DIR/postgres_scanner.duckdb_extension" "$EXT_DIR/"
        docker exec ducklake-pg createdb -U postgres ducklakedb
        build/release/test/unittest --test-config test/configs/postgres.json --test-dir ./ "test/sql/*"

