name: MinIo Tests
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  repository_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash

env:
  BASE_BRANCH: ${{ github.base_ref || (endsWith(github.ref, '_feature') && 'feature' || 'main') }}

jobs:
  rest:
    name: Tests using MinIo (AWS)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ startsWith(vars.CI_RUNS_ON, '[') && fromJSON(vars.CI_RUNS_ON) || vars.CI_RUNS_ON || 'gama-arc' }}
    env:
      VCPKG_TARGET_TRIPLET: 'x64-linux-release'
      GEN: ninja
      VCPKG_FEATURE_FLAGS: "-binarycaching"
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      PIP_BREAK_SYSTEM_PACKAGES: 1
      BUILD_EXTENSION_TEST_DEPS: full
      S3_TEST_SERVER_AVAILABLE: 1

    steps:
      # No root/package-manager on gama-arc: the image has build-essential, python3, git,
      # docker and the `docker compose` plugin (scripts/start-docker.sh uses it,
      # not the 1.29.2 docker-compose binary this job used to download).
      # cmake 3.x/ninja/ccache go into user space (forge#126).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'

      - uses: ./.github/actions/user-space-build-tools

      - name: Checkout DuckDB to version
        run: |
          cd duckdb
          git checkout $(cat ../.github/duckdb-version)

      # The version this job checks out must be a RELEASE tag; a dev sha here is
      # what made #43, and it stays green until a consumer tries to load it.
      - uses: ./.github/actions/refuse-unreleased-duckdb-pin

      - name: Check installed versions
        run: |
          ninja --version
          cmake --version

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.1
        with:
          vcpkgGitCommitId: 84bab45d415d22042bd0b9081aea57f362da3f35

      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@main
        with:
          install: 'no'  # ccache comes from user-space-build-tools; the action would need root (forge#126)
          key: ${{ github.job }}
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Build extension
        env:
          GEN: ninja
        run: |
          make release

      - name: Test MinIO - AWS
        run: |
          ./scripts/start-docker.sh
          build/release/test/unittest --test-config test/configs/minio.json "test/sql/*"

