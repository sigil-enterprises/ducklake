name: Debug Mode Tests
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash

jobs:
  ducklake-config-tests:
    name: DuckLake (Debug)
    runs-on: ${{ startsWith(vars.CI_RUNS_ON, '[') && fromJSON(vars.CI_RUNS_ON) || vars.CI_RUNS_ON || 'gama-arc' }}
    strategy:
      matrix:
        arch: ['linux_amd64']
        vcpkg_version: [ '2023.04.15' ]
        include:
          - arch: 'linux_amd64'
            vcpkg_triplet: 'x64-linux'

    env:
      VCPKG_TARGET_TRIPLET: ${{ matrix.vcpkg_triplet }}
      GEN: Ninja
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      DISABLE_EXTENSIONS_FOR_TEST: ON

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
        submodules: 'true'

    - name: Checkout DuckDB to version
      run: |
        cd duckdb
        git checkout $(cat ../.github/duckdb-version)

    # The version this job checks out must be a RELEASE tag; a dev sha here is
    # what made #43, and it stays green until a consumer tries to load it.
    - uses: ./.github/actions/refuse-unreleased-duckdb-pin

    - uses: ./.github/actions/user-space-build-tools

    - name: Setup Ccache
      uses: hendrikmuhs/ccache-action@main
      with:
        install: 'no'  # ccache comes from user-space-build-tools; the action would need root (forge#126)
        key: ${{ github.job }}
        save: ${{ github.ref == 'refs/heads/main' }}

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11.1
      with:
        vcpkgGitCommitId: a42af01b72c28a8e1d7b48107b33e4f286a55ef6

    - name: Build extension
      env:
        GEN: ninja
        CMAKE_BUILD_PARALLEL_LEVEL: 2
      run: |
        make debug

    - name: Test extension
      run: |
        build/debug/test/unittest
