# PRIVATE-FORK ONLY. Never cherry-pick to the public upstream fork.
#
# The workflow issue #52 says does not exist.
#
# THE DEFECT. Every fixture that exercises the KMS envelope needs a reachable
# key service, so each carries `require-env`. A require-env fixture whose
# variable is unset SKIPS - and a skip EXITS ZERO. So a tree in which the
# envelope had never once executed was indistinguishable, from CI's colour, from
# one in which it passed. Nothing under .github/workflows/ invoked either
# runner, and nothing went red for months.
#
# WHAT MAKES THIS DIFFERENT FROM "ADD A JOB". A build with no concrete KMS
# provider refuses every enveloped ATTACH, so simply running the fixtures would
# have produced a red nobody could fix inside this repository - the only real
# provider is out of tree and private. `test/kms_provider/` is a TEST-ONLY
# provider that speaks the same wire as the in-tree fake key services, overlaid
# through the SAME `if(EXISTS crypta-provider)` pickup hook a real provider
# uses. It performs no cryptography. Its whole job is to make the ATTACH-time
# factory non-null so that DuckLake's own envelope branches are REACHED.
#
# CONTROLS, because a check that has never been shown to fire proves nothing:
#   - each guard below runs its own positive control first;
#   - assert_kms_provider_reachable.sh reads WHICH refusal a dead socket
#     produces, and the refusal a provider-less build gives is one it rejects;
#   - each runner refuses a run in which its fixtures reported no assertions,
#     which is the only thing that distinguishes a skip from a pass.
name: Envelope

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  guards:
    name: Envelope guards (no build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse a vacuous refusal assertion (issue #50)
        run: python3 scripts/ci/assert_refusal_assertions_distinguish.py

      - name: Refuse envelope fixtures that CI never runs (issue #52)
        if: always()
        run: python3 scripts/ci/assert_envelope_fixtures_run_in_ci.py

      - name: Refuse a KMS wire version that is not one value across the tree
        if: always()
        run: python3 scripts/ci/assert_kms_wire_version_agrees.py

  envelope-e2e:
    name: KMS envelope end to end (test provider + fake key service)
    runs-on: ubuntu-latest
    env:
      VCPKG_TARGET_TRIPLET: x64-linux
      GEN: Ninja
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

    steps:
      - name: Install required ubuntu packages
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build ccache python3

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'

      - name: Checkout DuckDB to version
        run: |
          cd duckdb
          git checkout $(cat ../.github/duckdb-version)

      - uses: ./.github/actions/refuse-unreleased-duckdb-pin

      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@main
        with:
          key: ${{ github.job }}
          save: ${{ github.ref == 'refs/heads/main' || github.repository != 'duckdb/ducklake' }}

      # 84bab45d, NOT the a42af01b the other jobs use. This job builds with
      # BUILD_EXTENSION_TEST_DEPS=full, which pulls httpfs and so curl, openssl,
      # lz4, roaring and zlib. a42af01b's version database predates the versions
      # the manifest asks for and vcpkg install dies with
      #     error: no version database entry for curl at 8.17.0
      # Measured twice, on two heads. Every workflow here that sets
      # BUILD_EXTENSION_TEST_DEPS=full - Catalogs.yml, MinIO.yml - already pins
      # 84bab45d; only the jobs that do not need the extra ports pin a42af01b.
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.1
        with:
          vcpkgGitCommitId: 84bab45d415d22042bd0b9081aea57f362da3f35

      # The pickup hook is `if(EXISTS src/crypta-provider)`. Overlaying through
      # it, rather than teaching CMake a second path for tests, is deliberate:
      # it means this job exercises the SAME wiring a real out-of-tree provider
      # arrives on, so a break in that wiring reds here.
      - name: Overlay the test-only KMS provider
        run: |
          test ! -e src/crypta-provider || { echo "::error::src/crypta-provider already exists - refusing to overlay over it"; exit 1; }
          cp -R test/kms_provider src/crypta-provider
          test -f src/crypta-provider/test_kms_provider.cpp
          test -f src/crypta-provider/CMakeLists.txt

      - name: Build extension and test binaries
        env:
          GEN: ninja
          BUILD_EXTENSION_TEST_DEPS: full
        run: make release

      # Reads WHICH refusal a dead socket produces. A provider-less build says
      # "has no KMS encryption provider" and this step rejects it; only a build
      # in which the factory actually ran can say "cannot reach the key
      # service". That is what makes the runners below meaningful.
      - name: Control - this build really carries a KMS provider
        run: scripts/ci/assert_kms_provider_reachable.sh build/release/duckdb

      # POSITIVE CONTROL FOR ISSUE #67. envelope_e2e_wrapped_catalog.test,
      # envelope_unenveloped_reader_refusal.test and envelope_wrap_idempotence.test
      # all assert something HAPPENED (wrap_batch called, encryption_key wrapped,
      # a bare re-attach refused) or DIDN'T (no double wrap). An assertion of that
      # shape reports the same green whether it is checking anything or not - it
      # has to be shown to FAIL on a deliberately broken envelope before a pass
      # against the real one means anything (mirrors issue #61).
      #
      # DUCKLAKE_TEST_KMS_NOOP=1 swaps in NoOpKmsProvider (test/kms_provider/
      # test_kms_provider.cpp): ATTACH still succeeds and the self-test still
      # passes, but WrapKeys/UnwrapKey never touch the socket and hand keys back
      # unwrapped - exactly the "envelope never engaged" bug these fixtures exist
      # to catch. Each of the three below must FAIL against it, or the fixture
      # is not proving anything.
      - name: RED control - these fixtures must fail against a no-op envelope (issue #67)
        env:
          DUCKLAKE_TEST_KMS_NOOP: "1"
        run: |
          fail=0

          if test/sql/encryption/run_envelope_e2e.sh; then
            echo "::error::envelope_e2e_wrapped_catalog.test PASSED against a no-op envelope - its wrap_batch/RExL/length/refusal assertions do not catch a bypassed envelope"
            fail=1
          else
            echo "confirmed: envelope_e2e_wrapped_catalog.test fails against a no-op envelope"
          fi

          if test/sql/encryption/run_envelope_fixture.sh test/sql/encryption/envelope_unenveloped_reader_refusal.test; then
            echo "::error::envelope_unenveloped_reader_refusal.test PASSED against a no-op envelope - the bare re-attach refusal does not catch a bypassed envelope"
            fail=1
          else
            echo "confirmed: envelope_unenveloped_reader_refusal.test fails against a no-op envelope"
          fi

          if test/sql/encryption/run_envelope_fixture.sh test/sql/encryption/envelope_wrap_idempotence.test; then
            echo "::error::envelope_wrap_idempotence.test PASSED against a no-op envelope - the wrap-count assertion does not catch a bypassed envelope"
            fail=1
          else
            echo "confirmed: envelope_wrap_idempotence.test fails against a no-op envelope"
          fi

          if [ "${fail}" -ne 0 ]; then
            echo "::error::at least one envelope fixture did not go red against a no-op envelope - see above"
            exit 1
          fi

      - name: KMS envelope end to end (issue #52)
        run: test/sql/encryption/run_envelope_e2e.sh

      # Asserts the property envelope_e2e_wrapped_catalog.test's fourth
      # assertion is aimed at, on queries that can actually carry it. That
      # file asserts it on `SELECT count(*)`, which is answered from
      # ducklake_table_stats without opening a file and so cannot fail on a
      # healthy lake - see this fixture's header for the measurement.
      - name: An unenveloped reader is refused (issue #52)
        if: always()
        run: test/sql/encryption/run_envelope_fixture.sh test/sql/encryption/envelope_unenveloped_reader_refusal.test

      # Never invoked by any workflow before issue #67 - a require-env fixture
      # nothing runs SKIPS and exits zero. Its own header says its RED colour on
      # main is currently attributable to #52, not #51 - it is a standing probe,
      # not proof of #51 - but that is no reason to leave it unrun.
      #
      # A SEPARATE invocation, not another argument to the step above: the
      # runner mints one operation log per run, and this fixture's first
      # assertion counts wrap_batch entries in that log against the number of
      # data files in ITS OWN lake. Sharing a log with another fixture would
      # make the count meaningless.
      - name: No DEK is wrapped twice (issue #67, standing probe for #51)
        if: always()
        run: test/sql/encryption/run_envelope_fixture.sh test/sql/encryption/envelope_wrap_idempotence.test

      - name: The crypta fixture group, with a key service behind it
        if: always()
        run: test/sql/crypta/run_sql_crypta_tests.sh

  # bench#182 / bench#176: `test/cpp/crypta/mutants.py resolve --extension`
  # (MutantRoster.yml) proves every EXTENSION_MUTANTS entry's `old` text
  # matches and every `reddens` file exists - milliseconds, no build. It does
  # NOT prove that applying one actually turns a green fixture red; a resolver
  # that is satisfied by a mutant which BUILDS but changes nothing would say
  # the same "all N mutants resolve". This job is that missing half: it
  # PATCHES one guard out of the tree, in place, and requires the exact
  # fixture named in `reddens` to fail on the exact statement named in
  # `redden_at` - not merely "the group had a failure somewhere". The envelope
  # job above is this job's GREEN control: same fixture group, same build
  # recipe, unpatched tree, and it is required to pass.
  #
  # bench#157 gap, PARTIALLY CLOSED: a third security review of PR #95 found
  # this job live-fired only `no_resolved_encryption_check`, leaving the other
  # extension mutants - including the two server-side ducklake_commit ones
  # this fix's own guard depends on - checked SOLELY by `mutants.py resolve`
  # (static: does the `old` text match, does the `reddens` file exist), never
  # actually applied-and-reddened here. A matrix over the mutant NAME closes
  # that for the mutants this PR touches; the remaining EXTENSION_MUTANTS
  # entries (no_partition_alter_refusal, no_partition_write_refusal_body,
  # no_partition_write_refusal_on_append, no_partition_write_refusal_on_
  # compaction) are UNCHANGED by this fix and are NOT added here - wiring
  # every roster entry into a live-fire matrix is a broader CI change, out of
  # scope for this fix, and is recorded as a named follow-up in this PR's
  # description rather than attempted piecemeal here.
  crypta-mutant-red-control:
    name: A crypta guard removed by mutants.py actually reddens its fixture (${{ matrix.mutant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mutant:
          - no_resolved_encryption_check
          - no_partition_write_refusal_on_server_side_append
          - no_partition_write_refusal_on_server_side_compaction
    env:
      VCPKG_TARGET_TRIPLET: x64-linux
      GEN: Ninja
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

    steps:
      - name: Install required ubuntu packages
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build ccache python3

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'

      - name: Checkout DuckDB to version
        run: |
          cd duckdb
          git checkout $(cat ../.github/duckdb-version)

      - uses: ./.github/actions/refuse-unreleased-duckdb-pin

      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@main
        with:
          key: ${{ github.job }}
          save: ${{ github.ref == 'refs/heads/main' || github.repository != 'duckdb/ducklake' }}

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.1
        with:
          vcpkgGitCommitId: 84bab45d415d22042bd0b9081aea57f362da3f35

      - name: Overlay the test-only KMS provider
        run: |
          test ! -e src/crypta-provider || { echo "::error::src/crypta-provider already exists - refusing to overlay over it"; exit 1; }
          cp -R test/kms_provider src/crypta-provider
          test -f src/crypta-provider/test_kms_provider.cpp
          test -f src/crypta-provider/CMakeLists.txt

      # ONE mutant, patched IN THE TREE before the only build this job does.
      # Which one comes from the matrix above; `mutants.py resolve --extension`
      # (MutantRoster.yml) already proved its `old` text matches exactly once
      # and every file its `reddens` names exists - this proves the removal
      # actually turns that fixture red, on the exact statement it names.
      - name: Patch out a crypta guard (mutants.py, ${{ matrix.mutant }})
        run: python3 test/cpp/crypta/mutants.py patch "${{ matrix.mutant }}" .

      - name: Build extension and test binaries (guard removed)
        env:
          GEN: ninja
          BUILD_EXTENSION_TEST_DEPS: full
        run: make release

      - name: Control - this build really carries a KMS provider
        run: scripts/ci/assert_kms_provider_reachable.sh build/release/duckdb

      # MUST fail. `run_sql_crypta_tests.sh` exits non-zero on any fixture
      # failure, so `!` inverts that into the pass condition here. The marker
      # fragment(s) each mutant's `reddens`/`redden_at` name are read from
      # `mutants.py cases` rather than hard-coded, so this step works for
      # every entry in the matrix without a per-mutant grep line - and the
      # captured output is grepped for every one of them, not just "something
      # failed", so a fixture that died on its own ATTACH or a build-order
      # fluke cannot be counted as evidence for this guard.
      - name: The named fixture MUST redden on the named statement (${{ matrix.mutant }})
        run: |
          set +e
          output="$(test/sql/crypta/run_sql_crypta_tests.sh 2>&1)"
          status=$?
          echo "${output}"
          if [ "${status}" -eq 0 ]; then
            echo "::error::the crypta fixture group PASSED with ${{ matrix.mutant }} removed - the mutant did not redden anything"
            exit 1
          fi
          missing=0
          while IFS=$'\t' read -r test_file marker; do
            if [ -z "${marker}" ]; then
              echo "::error::${{ matrix.mutant }} names a reddens case (${test_file}) with no redden_at marker - this job cannot attribute a red to it"
              missing=1
              continue
            fi
            if ! grep -qF -- "${marker}" <<< "${output}"; then
              echo "::error::the fixture group failed, but not on the statement ${{ matrix.mutant }} names (${marker}) - this red is not attributable to it"
              missing=1
            else
              echo "confirmed: ${test_file} reddened on the statement ${{ matrix.mutant }} names"
            fi
          done < <(python3 test/cpp/crypta/mutants.py cases "${{ matrix.mutant }}")
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      # Restores the tree to the state the resolver's own positive control
      # (MutantRoster.yml) already requires: `old` present exactly once,
      # nothing applied. Not load-bearing for this job's proof - the red above
      # already happened - but a runner that left a mutated tree behind after
      # asserting something about it would be the next `verify-clean` was
      # written to catch.
      - name: Unpatch and verify the tree is clean
        if: always()
        run: |
          python3 test/cpp/crypta/mutants.py unpatch "${{ matrix.mutant }}" .
          for f in $(python3 test/cpp/crypta/mutants.py files); do
            git diff --exit-code -- "${f}"
          done
