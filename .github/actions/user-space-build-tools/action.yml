name: User-space build tools
description: >
  cmake 3.x, ninja and ccache installed under RUNNER_TEMP and put on PATH,
  with no root and no package manager. The gama-arc runner image (gh-runner-sigil
  2.337.0-gama6) ships build-essential, python3-venv, docker + the compose
  plugin, and NOT cmake, ninja or ccache; its uid has no root
  (allowPrivilegeEscalation=false) and cannot write /usr/local/bin (forge#126).
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/user-tools/bin"
        mkdir -p "$bin"
        # cmake 3.x (the job formerly pinned 'cmake=3.*') and ninja from PyPI wheels.
        python3 -m venv "$RUNNER_TEMP/user-tools/venv"
        # --require-hashes: sha256 of the manylinux x86_64 wheels, from PyPI.
        cat > "$RUNNER_TEMP/user-tools/req.txt" <<'REQ'
        cmake==3.31.6 \
          --hash=sha256:2297e9591307d9c61e557efe737bcf4d7c13a30f1f860732f684a204fee24dca \
          --hash=sha256:1c8b05df0602365da91ee6a3336fe57525b137706c4ab5675498f662ae1dbcec
        ninja==1.11.1.4 \
          --hash=sha256:096487995473320de7f65d622c3f1d16c3ad174797602218ca8c967f51ec38a0
        REQ
        "$RUNNER_TEMP/user-tools/venv/bin/pip" install --quiet --only-binary=:all: --require-hashes \
          -r "$RUNNER_TEMP/user-tools/req.txt"
        ln -sf "$RUNNER_TEMP/user-tools/venv/bin/cmake" "$bin/cmake"
        ln -sf "$RUNNER_TEMP/user-tools/venv/bin/ninja" "$bin/ninja"
        # ccache: upstream static release, sha256-pinned. hendrikmuhs/ccache-action
        # would otherwise need root, then write /usr/local/bin; both fail here.
        v=4.10.2
        sha=80cab87bd510eca796467aee8e663c398239e0df1c4800a0b5dff11dca0b4f18
        curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/user-tools/ccache.txz" \
          "https://github.com/ccache/ccache/releases/download/v${v}/ccache-${v}-linux-x86_64.tar.xz"
        echo "${sha}  $RUNNER_TEMP/user-tools/ccache.txz" | sha256sum -c -
        tar -xJf "$RUNNER_TEMP/user-tools/ccache.txz" -O "ccache-${v}-linux-x86_64/ccache" > "$bin/ccache"
        chmod 0755 "$bin/ccache"
        echo "$bin" >> "$GITHUB_PATH"
        PATH="$bin:$PATH"
        cmake --version | head -1; ninja --version; ccache --version | head -1
