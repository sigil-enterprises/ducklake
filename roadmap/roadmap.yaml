# ProjectRoadmapManifest@v1 - ducklake (the sigil fork of duckdb/ducklake).
#
# FULLY RECONSTRUCTED 2026-08-05 from forge history (11-planning/09-10). This fork
# carried the crypta envelope work from 2026-07-28 to 2026-08-05 before any roadmap
# existed, so EVERY milestone and epic here is derived from git log, tags/releases,
# merged PRs and the tracker - each marked `provenance: retro-derived` with the forge
# coordinates it was derived FROM and the derivation date.
#
# SCOPE NOTE. This roadmap plans the SIGIL FORK's own work only - the crypta
# envelope-encryption provider and the fork's build/CI. It does NOT plan upstream
# duckdb/ducklake, whose history this repo inherits. `inception_date` is therefore the
# fork's own inception on the sigil forge (repo created 2026-07-28T18:14:36Z), not the
# first commit reachable from HEAD, which belongs to upstream.
#
# INTENT HONESTY - and this repo is the UNUSUAL case, so read the reasoning.
# Unlike most reconstructions, ducklake HAS a genuine dated plan-of-record: issue #1
# ("Epic: HSM-rooted envelope key management - reviewed plan"), opened
# 2026-07-28T22:49:29Z. But the plan does NOT precede all of the work it names, and the
# gap has to be measured PER EPIC rather than once for the repo. An earlier draft of
# this file claimed a single 32h54m gap for the whole of M1, derived from the first
# commit on `release/v1.5-variegata`. That was WRONG: it missed the CSPRNG branch
# entirely, whose commit is the fork's true first. Measured per epic, earliest AUTHOR
# date of the first commit in the delivering PR against #1 at 2026-07-28T22:49:29Z:
#
#     E1.1  PR #4  530f9e56  2026-07-28T22:55:18Z   +5m 49s    SAME DAY  -> UNPROVEN
#     E1.3  PR #3  201fe5a8  2026-07-30T07:43:49Z   +32h 54m   +2 days   -> proven
#     E1.2  PR #5  d24bb67e  2026-08-03T23:52:13Z   +6d        -> proven
#     E1.5  PR #6  c885653e  2026-08-04T12:18:41Z   +6d        -> proven
#     E1.4  PR #9  c32eed45  2026-08-04T20:26:56Z   +6d        -> proven
#
# E1.1 is FIVE MINUTES AND FORTY-NINE SECONDS after the issue was opened, the same
# calendar day in UTC (2026-07-28) and in the native +0100 (23:49 vs 23:55). That is
# stricter than the teras-ext-pgwire 47-second precedent this file cites as its
# standard, and stricter than the 17-minute case the sibling crypta roadmap refuses.
# The quoted step-1 warrant is genuine text in the original body; the ORDERING is not
# there. So E1.1 is `intent: unproven`, evidence delivery-only, no matter how neatly
# its capability matches a numbered step. A warrant without ordering is not prior
# intent, and this is the one node where reading the plan instead of the clock nearly
# produced the exact fabrication this file exists to prevent.
#
# The other four epics clear the bar by days, so they carry `intent: proven`.
#
# The word ORIGINAL is doing real work there. Issue #1 has five body revisions - the
# original plus four edits (verified via GraphQL userContentEdits):
# 2026-07-28T22:49:29Z (creation),
# 2026-08-03T21:46:56Z, 2026-08-04T16:09:36Z, 2026-08-04T16:10:03Z, 2026-08-04T20:20:00Z.
# Today's body is the 2026-08-04T20:20 revision and carries scope that did NOT exist on
# 2026-07-28 - the OMOP migration promoted onto the critical path, the reordered
# upstream gate, the coupled rotation/crypto-shred item. Quoting today's body as
# 2026-07-28 intent would be fabricating prior intent by edit. So every `intent: proven`
# epic below is warranted ONLY against a numbered step present in the 07-28 ORIGINAL,
# and the warranting step is quoted in the epic's `capability`.
#
# Reference-corroboration splits ALMOST the same way, and where it disagrees the clock
# wins: PRs #3, #4, #5, #6, #7 and #9 each reference #1 in their bodies. PRs #16, #17,
# #22, #25 and #29 reference only reactive bug issues (#13, #14, #15, #18, #19, #20,
# #21, #24) opened minutes to hours before them in the same working session. That second
# class is REACTIVE work, recorded as `intake` / `class: unplanned`, never a proven
# epic. Note that PR #4 cites #1 and is STILL unproven: a PR referencing the plan is
# evidence of topic, not of ordering. Citation never substitutes for a timestamp.
#
# TRACKER REFS ARE REAL, NOT BACK-CREATED. No `roadmap:reconstructed` stub was created
# for this reconstruction. Every node points at an issue that genuinely already existed,
# so nothing here can be mistaken for prior intent that was minted today. Where a node's
# truthful tracker is the epic-of-record, it names `ducklake:#1` (an umbrella, shared by
# design). `tracker_ref` records WHERE work is tracked; `evidence` records what a claim
# RESTS on - and for every `intent: unproven` node the evidence is delivery-only or the
# reactive issue it was derived from, never an artifact posed as prior intent.
#
# *** NOTHING IN THIS REPO HAS SHIPPED. *** No milestone below is `status: shipped`,
# because this repo has no FINAL tag. Its only tag is `v1.5.3-crypta.1`, which the forge
# reports as `prerelease: true` (measured 2026-08-05 via the releases API) and which
# semver reads as a prerelease of 1.5.3. Recording any of it as shipped would be the
# release-side vacuous green.
#
# That is not a temporary state, and it needs a human. The fork's tag scheme
# `v<duckdb-version>-crypta.<n>` can NEVER produce a final release: promoting it means
# tagging plain `v1.5.3`, which is upstream DuckDB's own version and is not this fork's
# to claim. Under the current scheme no ducklake milestone can EVER be marked `shipped`.
# The natural fix - semver build metadata, `v1.5.3+crypta.1` - is ALSO blocked: `+` is
# outside the roadmap validator's EVIDENCE_GRAMMAR (`[A-Za-z0-9._-]`), so such a tag
# could not be cited as evidence by its own roadmap. The remaining option, and what the
# `version:` fields below PROPOSE, is to version the fork's provider natively (v0.1.0,
# v0.2.0, ... GA at v1.0.0) and carry the DuckDB patch as a build dimension rather than
# a version prefix - which is exactly how the consumer `crypta` is already versioned.
# Every `version:` below is therefore a PROPOSAL awaiting ratification, not an
# observation. Likewise `rc_soaked: false` everywhere: no `-rc.N` tag exists here.
#
# THE SAME SCHEME ALSO DISARMS THE TAG-IMMUTABILITY GUARD, and this file will not
# pretend otherwise. `roadmap_evidence_check.py` pins every cited tag to a commit SHA in
# `roadmap/evidence.lock` so a deleted-and-recut tag reds instead of resolving quietly.
# Its RE_TAG is `^<repo>:(v\d+\.\d+\.\d+(-rc\.\d+)?)$`, which `v1.5.3-crypta.1` does not
# match. So this repo's ONLY tag cannot be locked, `roadmap/evidence.lock` is literally
# `{}`, and the gate reports "0 cited tag(s) still point at their pinned commits" and
# goes GREEN - an absence assertion passing over an empty set, which is the precise
# failure that script's own `milestone_version_tags` docstring was written to remove.
# Measured 2026-08-05. The lock is committed anyway, because a lock that has never been
# committed is indistinguishable from one that was deleted to hide a moved tag - but it
# protects nothing here until the tag scheme is settled. That is the second reason the
# scheme needs a decision, and it is not cosmetic.
#
# RATIFIED 2026-08-05 by the programme owner: the `feature_completeness` statement,
# the FC target, and the fork-native version scheme above. What is NOT ratified and
# stays PROPOSED is every `target_date` on an undelivered milestone - dates were not
# put to the human and must not be read as committed.
#
# THE VERSION SCHEME WAS THE LOAD-BEARING PART. Under the old
# `v<duckdb>-crypta.<n>` tags no milestone here could ever flip `shipped`: the
# promotion of `v1.5.3-crypta.1` is plain `v1.5.3`, which is UPSTREAM's tag, not
# the fork's. So the FC target was unreachable by construction and the plan could
# not fail visibly. Fork-native `v0.1.0 ... v1.0.0` makes it reachable. The
# existing `v1.5.3-crypta.1` prerelease is left in place - nothing is retagged or
# deleted, because a published tag is not ours to rewrite.
#
# Derivation still dates only the past. Only M1's `target_date` is an observation (the date its last
# constituent PR merged). M3 is `active` because one of its epics has already partly
# landed (PR #25), but its `target_date` is still a PROPOSAL, not an observation - an
# active milestone is not a delivered one.
schema: ProjectRoadmapManifest@v1
repo: ducklake
kind: Software
# exploratory, not plan-driven. Six of seventeen epics clear the ordering bar, against
# fourteen intake items. A dated plan-of-record exists and four epics genuinely executed
# off it, but the repo's working style is dominated by same-session reactive bursts, and
# declaring plan-driven on that ratio would overstate how much of this work was planned.
posture_declared: exploratory

feature_completeness:
  statement: "The sigil ducklake fork is production-ready as the teras lake's encryption provider - every data-file key in the catalog is an identity-bound crypta-wrapped blob rooted in an HSM, the provider FAILS CLOSED on every read and write path rather than silently emitting or accepting plaintext, no cleartext patient data reaches the catalog by inlining or column statistics, the reader-side residual (DEK cache, temp spill, snapshots) is bounded and documented, a rewrap sweep makes KEK retirement survivable, and the extension loads on every DuckDB patch pinned anywhere in the fleet. GA as v1.0.0."
  target: v1.0.0

updated: 2026-08-05
last_revision: 2026-08-05
inception_date: 2026-07-28    # fork created on the sigil forge, 2026-07-28T18:14:36Z

